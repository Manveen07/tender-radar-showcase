<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
/* Frames digest-card-raw.png (a real digest.py output for the sample firm in profiles/cleaning.yaml,
   7 July 2026) on paper, so it doesn't blend into the README page.
   Render (Windows paths): msedge --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files
   --force-device-scale-factor=2 --window-size=800,620 --virtual-time-budget=8000
   --screenshot=docs\digest-example.png file:///.../docs/digest-example.html */
:root{--paper:#f4f1ea;--wash:#ebe6da;--ink:#1d1d1d;--dim:#5a5750;--rule:#d9d3c5;--red:#c4161c}
*{box-sizing:border-box;margin:0}
body{width:800px;height:620px;background:var(--paper);color:var(--ink);font-family:Archivo,sans-serif;overflow:hidden;position:relative}
.kick{position:absolute;left:50px;top:30px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.card{position:absolute;left:50px;top:62px;width:700px;background:#fff;border:1px solid var(--rule);border-radius:6px;
  box-shadow:0 1px 2px rgba(29,29,29,.06),0 6px 18px rgba(29,29,29,.07);overflow:hidden}
.card img{display:block;width:700px}
.note{position:absolute;left:50px;top:566px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--red)}
</style></head><body>
<div class="kick">What a firm gets · digest.py · sample firm · 7 July 2026</div>
<div class="card"><img src="digest-card-raw.png" alt=""></div>
<div class="note">&uarr; right trade and region, flagged maybe: £2.38m for 3 schools against a firm turning over £380k</div>
</body></html>
